name: gia_su_tu_duy
description: Ứng dụng gia sư AI mã nguồn mở tích hợp trực tiếp — Gia Sư Tư Duy
publish_to: 'none'
version: 1.0.5+9

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP client để tải model GGUF & tra cứu VietJack / Lời Giải Hay
  http: ^1.2.0

  # Chọn ảnh từ camera hoặc thư viện
  image_picker: ^1.1.2

  # Lưu trữ cài đặt cục bộ
  shared_preferences: ^2.3.2

  # Đường dẫn thư mục cục bộ lưu file model AI (.gguf)
  path_provider: 2.1.5

  # Engine AI mã nguồn mở chạy GGUF offline trên Android (llama.cpp)
  llama_flutter_android: ^0.2.6

  # OCR nhận diện chữ viết / đề bài từ ảnh hoàn toàn offline trên máy
  google_mlkit_text_recognition: 0.15.0

  # Icons Material mặc định
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/curriculum_index.json
