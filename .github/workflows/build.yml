name: Build & Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Cho phép chạy thủ công

permissions:
  contents: write

jobs:
  build-apk:
    name: 🏗️ Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # 2. Cài Java 17
      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Cài Flutter stable
      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      # 3b. Cài NDK r27 và CMake 3.22.1 cho llama.cpp (llama_flutter_android)
      - name: 🛠️ Setup Android NDK r27 & CMake
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=$(find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -n 1)
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "ndk;27.0.12077973" "cmake;3.22.1"

      # 4. Kiểm tra Flutter
      - name: 🔍 Flutter doctor
        run: flutter doctor -v

      # 5. Tải dependencies
      - name: 📦 Get dependencies
        run: flutter pub get

      # 6. Lấy version từ pubspec.yaml (vd: 1.0.1)
      - name: 🏷️ Extract App Version
        id: ver
        run: |
          APP_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "version=$APP_VERSION" >> $GITHUB_OUTPUT
          echo "Detected app version: $APP_VERSION"

      # 7. Build APK release
      - name: 🔨 Build APK (release)
        run: flutter build apk --release --no-shrink

      # 8. Đổi tên APK
      - name: 📝 Rename APK
        run: |
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-release.apk artifacts/GiaSuTuDuy-v${{ steps.ver.outputs.version }}.apk

      # 9. Upload APK làm artifact (tải về từ Actions tab)
      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GiaSuTuDuy-v${{ steps.ver.outputs.version }}-APK
          path: artifacts/GiaSuTuDuy-v${{ steps.ver.outputs.version }}.apk
          retention-days: 30

      # 10. Tự động tạo GitHub Release với APK đính kèm
      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: "🎓 Gia Sư Tư Duy v${{ steps.ver.outputs.version }}"
          body: |
            ## 📱 Gia Sư Tư Duy — Phiên bản v${{ steps.ver.outputs.version }}

            ### Điểm mới ở bản v${{ steps.ver.outputs.version }} (AI Mã Nguồn Mở Tích Hợp):
            - 🧠 **Tích hợp sẵn engine AI mã nguồn mở (`llama.cpp` + Qwen 2.5)** chạy trực tiếp trên điện thoại Android (ARM64) — **không cần API Key**, **không phụ thuộc app hay dịch vụ AI thứ 3**
            - 📦 **APK gọn nhẹ (~40MB)** — mở app lần đầu nhấn **Tải AI về máy** (chọn bản **Qwen 2.5 1.5B ~1.04 GB** hoặc **Qwen 2.5 0.5B ~469 MB** từ HuggingFace) rồi dùng **vĩnh viễn** ngay cả khi ngoại tuyến
            - 📷 **Nhận diện chữ từ ảnh đề bài offline (ML Kit OCR)** — chụp ảnh hoặc chọn từ thư viện để đọc đề bài trực tiếp trên máy
            - 📚 **Tự tra cứu trực tiếp VietJack & Lời Giải Hay** dựa trên chỉ mục 1.980 đầu sách SGK/SBT (khi có mạng) và trích dẫn rõ nguồn tham khảo
            - 📖 Chế độ **Giải chi tiết + Nguồn** hoặc 💡 **Gợi mở Socratic** từng bước
            - 👨‍🎓 Tác giả: **Nguyễn Hồng Quang — Lớp 10A10 — THPT Châu Thành 1**

            ### Cách cài đặt & sử dụng:
            1. Tải file `.apk` bên dưới về điện thoại Android (ARM64, Android 8.0+)
            2. Mở file và nhấn **Cài đặt**
            3. Mở app → Nhấn **Tải AI về máy** (khoảng 469 MB hoặc 1.04 GB tùy chọn)
            4. Bắt đầu hỏi bài & chụp đề bài ngay — không cần đăng nhập hay API Key! 🚀
          files: artifacts/GiaSuTuDuy-v${{ steps.ver.outputs.version }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
