name: Build & Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Cho phép chạy thủ công

permissions:
  contents: write

jobs:
  build-apk:
    name: 🏗️ Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # 2. Cài Java 17
      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Cài Flutter stable
      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      # 4. Kiểm tra Flutter
      - name: 🔍 Flutter doctor
        run: flutter doctor -v

      # 5. Tải dependencies
      - name: 📦 Get dependencies
        run: flutter pub get

      # 6. Build APK release
      - name: 🔨 Build APK (release)
        run: flutter build apk --release --no-shrink

      # 7. Đổi tên APK
      - name: 📝 Rename APK
        run: |
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-release.apk artifacts/GiaSuTuDuy-v${{ github.run_number }}.apk

      # 8. Upload APK làm artifact (tải về từ Actions tab)
      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GiaSuTuDuy-APK
          path: artifacts/GiaSuTuDuy-v${{ github.run_number }}.apk
          retention-days: 30

      # 9. Tự động tạo GitHub Release với APK đính kèm
      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "🎓 Gia Sư Tư Duy v1.0.${{ github.run_number }}"
          body: |
            ## 📱 Gia Sư Tư Duy — Bản cập nhật v1.0.${{ github.run_number }}

            ### Cách cài đặt:
            1. Tải file `.apk` bên dưới về điện thoại Android
            2. Mở file và nhấn **Cài đặt** (cho phép cài từ nguồn không xác định nếu cần)
            3. Mở app → Nhấn ⚙️ → Dán Gemini API Key của bạn
            4. Bắt đầu học! 🚀

            ### Lấy API Key miễn phí:
            Vào [aistudio.google.com](https://aistudio.google.com) → Get API Key → Create API Key

            ### Tính năng:
            - 📐 Toán | ⚡ Vật Lý | 🧪 Hóa Học | 🌍 Tiếng Anh
            - 🤖 AI gia sư Socratic — gợi mở từng bước, không cho đáp án thẳng
            - 📸 Chụp ảnh đề bài gửi thẳng vào chat
            - 💬 Hỗ trợ hội thoại nhiều lượt
          files: artifacts/GiaSuTuDuy-v${{ github.run_number }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
